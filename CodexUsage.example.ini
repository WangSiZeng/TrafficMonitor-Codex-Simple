[config]
; Read once at plugin startup. Restart TrafficMonitor after editing.
; Default 300 seconds; supported range: 30 to 86400.
refresh_seconds=300
show_remaining=1
; Plugin-drawn taskbar bar, independent of TrafficMonitor's global graph switch.
graph_enabled=0
graph_mode=remaining
; COLORREF decimal value: 12632256 = RGB(192,192,192).
graph_color=12632256
graph_follow_theme=0
; bar = proportional fill; scroll = one column per refresh_seconds interval.
; Only successful live queries add history; missing query intervals stay empty.
graph_type=bar
show_reset_time=0
; all = both quota reset times; 5h or 7d = only that quota's reset time.
reset_time_scope=all
; Timestamp font size in points, any positive integer. Default: 10.
time_font_size=10
; Opt in only if you want local conversation files read when queries fail.
allow_local_fallback=0
; Optional absolute path to a trusted native codex.exe (not a .cmd shim).
; codex_path=C:\Tools\Codex\codex.exe
; Optional absolute sessions directory. Otherwise CODEX_HOME is respected.
; sessions_dir=C:\CodexData\sessions
